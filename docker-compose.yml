services:
  neo4j:
    image: neo4j:5
    container_name: project1-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (used by app.py)
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data   # data survives even if the container is deleted

volumes:
  neo4j_data:
